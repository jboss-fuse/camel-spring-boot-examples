# Endpoints and runtime settings may be overridden through environment variables.
camel.main.name=medical-claim-adjudication
camel.main.run-controller=true
camel.main.shutdown-timeout=180
spring.main.web-application-type=servlet
claims.instance-id=${CLAIMS_INSTANCE_ID:claims-1}

# MCP tools use the same JDBC lookup routes as automatic adjudication.
server.address=${CLAIMS_BIND_ADDRESS:127.0.0.1}
server.port=${CLAIMS_HTTP_PORT:8081}
camel.mcp-server.enabled=true
camel.mcp-server.tags=${claims.ai.tool-tags},${claims.reviews.tool-tags}
camel.mcp-server.tool-timeout=${CLAIMS_MCP_TOOL_TIMEOUT_MS:20000}
spring.ai.mcp.server.name=medical-claim-tools
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.streamable-http.mcp-endpoint=${CLAIMS_MCP_PATH:/mcp}

camel.component.kafka.brokers=${KAFKA_BROKERS:localhost:9092}
claims.kafka.incoming-topic=${CLAIMS_INCOMING_TOPIC:incoming-claims}
claims.kafka.results-topic=${CLAIMS_RESULTS_TOPIC:adjudicated-claims}
claims.kafka.failures-topic=${CLAIMS_FAILURES_TOPIC:failed-claims}
claims.kafka.group-id=${CLAIMS_GROUP_ID:medical-claim-adjudicator}
claims.kafka.consumers-count=${CLAIMS_CONSUMERS_COUNT:1}
claims.kafka.max-poll-interval-ms=${CLAIMS_MAX_POLL_INTERVAL_MS:900000}
claims.kafka.max-poll-records=${CLAIMS_MAX_POLL_RECORDS:1}
claims.kafka.input-endpoint=kafka:{{claims.kafka.incoming-topic}}?groupId={{claims.kafka.group-id}}&consumersCount={{claims.kafka.consumers-count}}&autoOffsetReset=earliest&autoCommitEnable=false&allowManualCommit=true&breakOnFirstError=true&maxPollRecords={{claims.kafka.max-poll-records}}&maxPollIntervalMs={{claims.kafka.max-poll-interval-ms}}
claims.kafka.results-endpoint=kafka:{{claims.kafka.results-topic}}?requestRequiredAcks=all&synchronous=true
# Persistent review views resume committed offsets; use a fresh group ID for an explicit rebuild.
claims.reviews.tool-tags=${CLAIMS_REVIEW_TOOL_TAGS:claims-review}
claims.reviews.group-id=${CLAIMS_REVIEWS_GROUP_ID:medical-claim-reviews-${claims.instance-id}}
claims.reviews.input-endpoint=kafka:{{claims.kafka.results-topic}}?groupId={{claims.reviews.group-id}}&autoOffsetReset=earliest&autoCommitEnable=false&allowManualCommit=true&breakOnFirstError=true&maxPollRecords=1
# Human review commands use a shared worker group; only confirmed terminal publication permits a commit.
claims.human-decisions.topic=${CLAIMS_HUMAN_DECISIONS_TOPIC:human-claim-decisions}
claims.human-decisions.group-id=${CLAIMS_HUMAN_DECISIONS_GROUP_ID:medical-claim-human-decisions}
claims.human-decisions.commands-endpoint=kafka:{{claims.human-decisions.topic}}?requestRequiredAcks=all&synchronous=true
claims.human-decisions.input-endpoint=kafka:{{claims.human-decisions.topic}}?groupId={{claims.human-decisions.group-id}}&autoOffsetReset=earliest&autoCommitEnable=false&allowManualCommit=true&breakOnFirstError=true&maxPollRecords=1
claims.kafka.failures-endpoint=kafka:{{claims.kafka.failures-topic}}?requestRequiredAcks=all&synchronous=true

camel.component.openai.base-url=${AI_BASE_URL:http://localhost:11434/v1}
camel.component.openai.api-key=${AI_API_KEY:local-placeholder}
camel.component.openai.model=${AI_MODEL:mimo-v2.6:9b}
claims.ai.tool-tags=${CLAIMS_AI_TOOL_TAGS:claims}
claims.ai.system-prompt-resource=${CLAIMS_SYSTEM_PROMPT:classpath:prompts/adjudication.txt}
claims.ai.request-timeout-ms=${AI_REQUEST_TIMEOUT_MS:60000}
claims.ai.temperature=${AI_TEMPERATURE:0}
# compatibility permits one complete surrounding JSON fence; schema requests strict structured output.
# Select schema only after verifying the deployed runtime/model supports its response_format contract.
claims.ai.output-policy=${AI_OUTPUT_POLICY:compatibility}
claims.ai.max-response-bytes=${AI_MAX_RESPONSE_BYTES:16384}
claims.ai.max-tokens=${AI_MAX_TOKENS:768}
claims.ai.final-endpoint=openai:chat-completion?autoToolExecution=false&storeFullResponse=true&requestTimeout={{claims.ai.request-timeout-ms}}&maxRetries=0&conversationMemory=false&temperature={{claims.ai.temperature}}&maxTokens={{claims.ai.max-tokens}}
claims.retry.maximum-redeliveries=${CLAIMS_MAX_REDELIVERIES:1}
claims.retry.delay-ms=${CLAIMS_RETRY_DELAY_MS:1000}

# Persist pending human decisions and audit records across restarts.
spring.datasource.url=${CLAIMS_DB_URL:jdbc:h2:file:./data/medical-claims-${claims.instance-id}}
spring.datasource.driver-class-name=${CLAIMS_DB_DRIVER:org.h2.Driver}
spring.datasource.username=${CLAIMS_DB_USER:sa}
spring.datasource.password=${CLAIMS_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${CLAIMS_DB_POOL_SIZE:4}
spring.datasource.hikari.connection-timeout=${CLAIMS_DB_CONNECTION_TIMEOUT_MS:5000}
spring.sql.init.mode=always
claims.jdbc.query-timeout-seconds=${CLAIMS_DB_QUERY_TIMEOUT_SECONDS:5}
claims.jdbc.endpoint=jdbc:dataSource?useHeadersAsParameters=true&statement.queryTimeout={{claims.jdbc.query-timeout-seconds}}
